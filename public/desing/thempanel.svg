<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  
  <!-- Background -->
  <rect width="800" height="600" fill="#1A1A1A"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#A78BFA" text-anchor="middle">🎨 Color Palette - Design System</text>
  
  <!-- ============================================ -->
  <!-- CHARCOAL / DARK GRAY COLORS                  -->
  <!-- ============================================ -->
  
  <text x="50" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Charcoal / Dark Gray</text>
  
  <!-- Color Box 1 -->
  <rect x="50" y="120" width="100" height="100" rx="12" fill="#1A1A1A" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="100" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#1A1A1A</text>
  <text x="100" y="256" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Charcoal Dark</text>
  
  <!-- Color Box 2 -->
  <rect x="170" y="120" width="100" height="100" rx="12" fill="#242424" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="220" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#242424</text>
  <text x="220" y="256" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Charcoal Medium</text>
  
  <!-- Color Box 3 -->
  <rect x="290" y="120" width="100" height="100" rx="12" fill="#2D2D2D" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="340" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#2D2D2D</text>
  <text x="340" y="256" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Charcoal Light</text>
  
  <!-- ============================================ -->
  <!-- PURPLE COLORS                                -->
  <!-- ============================================ -->
  
  <text x="50" y="310" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Purple</text>
  
  <!-- Color Box 4 -->
  <rect x="50" y="330" width="100" height="100" rx="12" fill="#4C1D95"/>
  <text x="100" y="450" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#4C1D95</text>
  <text x="100" y="466" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Purple Deep</text>
  
  <!-- Color Box 5 -->
  <rect x="170" y="330" width="100" height="100" rx="12" fill="#7C3AED"/>
  <text x="220" y="450" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#7C3AED</text>
  <text x="220" y="466" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Purple Main</text>
  
  <!-- Color Box 6 -->
  <rect x="290" y="330" width="100" height="100" rx="12" fill="#A78BFA"/>
  <text x="340" y="450" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#A78BFA</text>
  <text x="340" y="466" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Purple Light</text>
  
  <!-- ============================================ -->
  <!-- LIGHT BLUE COLORS                            -->
  <!-- ============================================ -->
  
  <text x="450" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Light Blue</text>
  
  <!-- Color Box 7 -->
  <rect x="450" y="120" width="100" height="100" rx="12" fill="#38BDF8"/>
  <text x="500" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#38BDF8</text>
  <text x="500" y="256" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Light Blue Main</text>
  
  <!-- Color Box 8 -->
  <rect x="570" y="120" width="100" height="100" rx="12" fill="#7DD3FC"/>
  <text x="620" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#7DD3FC</text>
  <text x="620" y="256" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Light Blue Soft</text>
  
  <!-- Color Box 9 -->
  <rect x="690" y="120" width="100" height="100" rx="12" fill="#BAE6FD"/>
  <text x="740" y="240" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA" text-anchor="middle">#BAE6FD</text>
  <text x="740" y="256" font-family="'Inter', sans-serif" font-size="11" fill="#71717A" text-anchor="middle">Light Blue Pale</text>
  
  <!-- ============================================ -->
  <!-- USAGE GUIDE                                  -->
  <!-- ============================================ -->
  
  <rect x="450" y="310" width="300" height="200" rx="12" fill="#242424" stroke="#7C3AED" stroke-width="1"/>
  
  <text x="600" y="345" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#A78BFA" text-anchor="middle">📖 Usage Guide</text>
  
  <text x="470" y="380" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA">[•] Charcoal: Backgrounds and Surfaces</text>
  <text x="470" y="405" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA">[•] Purple: Primary Actions and Accents</text>
  <text x="470" y="430" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA">[•] Light Blue: Secondary Accents</text>
  <text x="470" y="455" font-family="'Inter', sans-serif" font-size="12" fill="#A1A1AA">[•] White: Text on Dark Backgrounds</text>
  <text x="470" y="480" font-family="'Inter', sans-serif" font-size="12" fill="#71717A">[•] Gray: Secondary Text (#A1A1AA)</text>
  
  <!-- Sample Text Preview -->
  <rect x="450" y="530" width="300" height="40" rx="8" fill="#7C3AED"/>
  <text x="600" y="555" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sample Button - Purple Main</text>
  
</svg>