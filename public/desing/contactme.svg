<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 680" width="1440" height="680">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgSection" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Blue Accent Gradient -->
    <linearGradient id="blueAccent" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0%" stop-color="#242424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowCard">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>

    <filter id="shadowButton">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.3"/>
    </filter>

    <filter id="inputGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7C3AED" flood-opacity="0"/>
    </filter>
  </defs>

  <!-- ============================================ -->
  <!-- SECTION BACKGROUND                           -->
  <!-- ============================================ -->
  <rect width="1440" height="680" fill="url(#bgSection)"/>

  <!-- Ambient Glows -->
  <ellipse cx="720" cy="340" rx="450" ry="300" fill="#7C3AED" fill-opacity="0.03" filter="url(#glowPurple)"/>
  <ellipse cx="200" cy="200" rx="200" ry="180" fill="#38BDF8" fill-opacity="0.02" filter="url(#glowPurple)"/>
  <ellipse cx="1240" cy="500" rx="200" ry="180" fill="#A78BFA" fill-opacity="0.02" filter="url(#glowPurple)"/>

  <!-- ============================================ -->
  <!-- SECTION HEADER                               -->
  <!-- ============================================ -->
  <g transform="translate(720, 45)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.6s" fill="freeze"/>
    
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#A78BFA" text-anchor="middle" letter-spacing="2">GET IN TOUCH</text>
    
    <text x="0" y="45" font-family="'Cal Sans', 'Inter', sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01">
      ارتباط با من
    </text>
    
    <rect x="-40" y="65" width="80" height="3" rx="1.5" fill="url(#purpleAccent)"/>
    
    <text x="0" y="100" font-family="'Inter', sans-serif" font-size="16" fill="#A1A1AA" text-anchor="middle">
      Have a project in mind? Let's work together!
    </text>
  </g>

  <!-- ============================================ -->
  <!-- CONTACT FORM (LEFT SIDE)                     -->
  <!-- ============================================ -->
  <g transform="translate(80, 180)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.5s" fill="freeze"/>

    <!-- Form Card -->
    <rect x="0" y="0" width="540" height="460" rx="20" fill="url(#cardBg)" stroke="#7C3AED" stroke-width="0.8" filter="url(#shadowCard)"/>

    <!-- Form Title -->
    <text x="30" y="40" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Send me a message</text>
    <rect x="30" y="52" width="50" height="2" rx="1" fill="url(#purpleAccent)"/>

    <!-- Form Fields -->
    <g transform="translate(30, 80)">
      
      <!-- Name Field -->
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">Full Name</text>
      <rect x="0" y="10" width="480" height="44" rx="10" fill="#1A1A1A" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="15" y="38" font-family="'Inter', sans-serif" font-size="14" fill="#52525B">John Doe</text>

      <!-- Email Field -->
      <text x="0" y="80" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">Email Address</text>
      <rect x="0" y="90" width="480" height="44" rx="10" fill="#1A1A1A" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="15" y="118" font-family="'Inter', sans-serif" font-size="14" fill="#52525B">hello@example.com</text>

      <!-- Subject Field -->
      <text x="0" y="160" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">Subject</text>
      <rect x="0" y="170" width="480" height="44" rx="10" fill="#1A1A1A" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="15" y="198" font-family="'Inter', sans-serif" font-size="14" fill="#52525B">Project inquiry</text>

      <!-- Message Field -->
      <text x="0" y="240" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#A1A1AA">Message</text>
      <rect x="0" y="250" width="480" height="100" rx="10" fill="#1A1A1A" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="15" y="285" font-family="'Inter', sans-serif" font-size="14" fill="#52525B">Tell me about your project...</text>

      <!-- Submit Button -->
      <g transform="translate(0, 375)" cursor="pointer">
        <rect x="0" y="0" width="480" height="48" rx="24" fill="url(#btnGrad)" filter="url(#shadowButton)"/>
        <text x="240" y="30" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send Message ✨</text>
        
        <!-- Hover Animation -->
        <rect x="0" y="0" width="480" height="48" rx="24" fill="none" opacity="0">
          <animate attributeName="opacity" values="0;0.15;0" dur="2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- CONTACT INFO & SOCIAL (RIGHT SIDE)           -->
  <!-- ============================================ -->
  <g transform="translate(680, 180)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.5s" fill="freeze"/>

    <!-- Contact Info Card -->
    <rect x="0" y="0" width="680" height="460" rx="20" fill="url(#cardBg)" stroke="#8B5CF6" stroke-width="0.8" filter="url(#shadowCard)"/>

    <!-- Contact Info Title -->
    <text x="30" y="40" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Contact Information</text>
    <rect x="30" y="52" width="50" height="2" rx="1" fill="url(#blueAccent)"/>

    <text x="30" y="85" font-family="'Inter', sans-serif" font-size="14" fill="#A1A1AA">
      Feel free to reach out through any of these channels.
    </text>

    <!-- Contact Details -->
    <g transform="translate(30, 115)">
      
      <!-- Email -->
      <g transform="translate(0, 0)" cursor="pointer">
        <rect x="0" y="0" width="50" height="50" rx="14" fill="#7C3AED" fill-opacity="0.12"/>
        <text x="25" y="32" font-family="'Inter', sans-serif" font-size="24" text-anchor="middle">📧</text>
        
        <text x="70" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A78BFA">Email</text>
        <text x="70" y="38" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">amirhosein@example.com</text>
      </g>

      <!-- Phone -->
      <g transform="translate(0, 80)" cursor="pointer">
        <rect x="0" y="0" width="50" height="50" rx="14" fill="#8B5CF6" fill-opacity="0.12"/>
        <text x="25" y="32" font-family="'Inter', sans-serif" font-size="24" text-anchor="middle">📞</text>
        
        <text x="70" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A78BFA">Phone</text>
        <text x="70" y="38" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">+98 21 1234 5678</text>
      </g>

      <!-- Location -->
      <g transform="translate(0, 160)" cursor="pointer">
        <rect x="0" y="0" width="50" height="50" rx="14" fill="#A78BFA" fill-opacity="0.12"/>
        <text x="25" y="32" font-family="'Inter', sans-serif" font-size="24" text-anchor="middle">📍</text>
        
        <text x="70" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#A78BFA">Location</text>
        <text x="70" y="38" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">Tehran, Iran</text>
      </g>

      <!-- Working Hours -->
      <g transform="translate(0, 240)" cursor="pointer">
        <rect x="0" y="0" width="50" height="50" rx="14" fill="#38BDF8" fill-opacity="0.12"/>
        <text x="25" y="32" font-family="'Inter', sans-serif" font-size="24" text-anchor="middle">⏰</text>
        
        <text x="70" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#7DD3FC">Working Hours</text>
        <text x="70" y="38" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF">Mon - Fri: 9AM - 6PM</text>
      </g>
    </g>

    <!-- Divider -->
    <rect x="30" y="395" width="620" height="1" fill="#7C3AED" opacity="0.15"/>

    <!-- Social Media Title -->
    <text x="30" y="430" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#A78BFA">Follow me on</text>

    <!-- Social Icons -->
    <g transform="translate(30, 445)">
      <!-- GitHub -->
      <g transform="translate(0, 0)" cursor="pointer">
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#1A1A1A" stroke="#7C3AED" stroke-width="0.8"/>
        <text x="22" y="28" font-family="'Inter', sans-serif" font-size="20" fill="#A78BFA" text-anchor="middle">🐙</text>
      </g>

      <!-- LinkedIn -->
      <g transform="translate(54, 0)" cursor="pointer">
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#1A1A1A" stroke="#8B5CF6" stroke-width="0.8"/>
        <text x="22" y="28" font-family="'Inter', sans-serif" font-size="20" fill="#A78BFA" text-anchor="middle">🔗</text>
      </g>

      <!-- Twitter -->
      <g transform="translate(108, 0)" cursor="pointer">
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#1A1A1A" stroke="#A78BFA" stroke-width="0.8"/>
        <text x="22" y="28" font-family="'Inter', sans-serif" font-size="20" fill="#A78BFA" text-anchor="middle">🐦</text>
      </g>

      <!-- Instagram -->
      <g transform="translate(162, 0)" cursor="pointer">
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#1A1A1A" stroke="#38BDF8" stroke-width="0.8"/>
        <text x="22" y="28" font-family="'Inter', sans-serif" font-size="20" fill="#7DD3FC" text-anchor="middle">📷</text>
      </g>

      <!-- Discord -->
      <g transform="translate(216, 0)" cursor="pointer">
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#1A1A1A" stroke="#7C3AED" stroke-width="0.8"/>
        <text x="22" y="28" font-family="'Inter', sans-serif" font-size="20" fill="#A78BFA" text-anchor="middle">🎮</text>
      </g>

      <!-- Telegram -->
      <g transform="translate(270, 0)" cursor="pointer">
        <rect x="0" y="0" width="44" height="44" rx="12" fill="#1A1A1A" stroke="#8B5CF6" stroke-width="0.8"/>
        <text x="22" y="28" font-family="'Inter', sans-serif" font-size="20" fill="#A78BFA" text-anchor="middle">✈️</text>
      </g>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- AVAILABLE FOR WORK BADGE                     -->
  <!-- ============================================ -->
  <g transform="translate(720, 660)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.4s" fill="freeze"/>

    <rect x="-100" y="-8" width="200" height="24" rx="12" fill="#1A1A1A" stroke="#38BDF8" stroke-width="0.8"/>
    <circle cx="-80" cy="4" r="5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="-60" y="9" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#7DD3FC">Available for freelance work</text>
  </g>

  <!-- ============================================ -->
  <!-- DESIGN SPECS PANEL                           -->
  <!-- ============================================ -->
  <g transform="translate(80, 665)" opacity="0.5">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" fill="#52525B">SECTION: Contact | 2-Column Layout | Form: 540×460px | Info Card: 680×460px | Gap: 60px</text>
  </g>

</svg>